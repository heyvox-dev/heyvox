# German TTS pronunciation lexicon (shipped defaults).
#
# espeak-ng's German G2P reads English loanwords by German spelling rules
# ("Headset" -> "He-az-et", "Cache" -> "Kache", "Daemon" -> "Dämon"). Each
# entry maps a written word to a German *respelling* that espeak-de turns into
# the intended sound. Matching is case-insensitive, on whole words; a plain
# German plural/genitive "s"/"es" after the word is kept ("Headsets" ->
# "Hedsetts"); where that reads wrong, add the plural as its own entry
# ("Caches"). Words inside hyphenated compounds match too ("Kokoro-Daemon").
# Multi-word keys ("Pull Request") match across a space or hyphen.
#
# Override or extend per user in <config dir>/tts-lexicon-de.yaml with the
# same format; a user value of "" removes a shipped entry.
#
# Check a respelling with:
#   python -c "from misaki import espeak; print(espeak.EspeakG2P(language='de')('Käsch'))"

# Hardware / audio
Headset: Hedsett
Mic: Meik
Speaker: Spieker

