[project]
name = "heyvox"
version = "1.2.2"
description = "macOS voice layer for AI coding agents — wake word, STT, TTS, HUD, media control"
license = "MIT"
requires-python = ">=3.12"
readme = "README.md"
authors = [
    { name = "Franz Felberer", email = "franz@felberer.at" },
]
keywords = [
    "voice", "speech", "tts", "stt", "wake-word", "mcp",
    "ai-coding", "macos", "local", "privacy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    # DEF-247: every entry below is capped one major version above whatever
    # is currently installed and proven working (mirrors the DEF-246 mcp fix
    # and DEF-222's ruff pin) — an unbounded floor is a bet that a third
    # party never ships a breaking release, which broke CI the same day for
    # mcp. 0.x packages are capped at <1.0, matching this file's own existing
    # anthropic>=0.84,<1 convention, not a stricter per-minor 0.x reading.
    "openwakeword>=0.6.0,<1.0",
    "pyaudio>=0.2.14,<1.0",
    "numpy>=1.24.0,<3.0",
    "soundfile>=0.12,<1.0",
    "PyYAML>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "platformdirs>=4.0,<5.0",
    "sherpa-onnx>=1.0,<2.0",
    "pyobjc-framework-Cocoa>=10.0,<13.0",
    "pyobjc-framework-Quartz>=10.0,<13.0",
    # DEF-225: ApplicationServices is a SEPARATE PyObjC distribution — Cocoa and
    # Quartz do not pull it in. Without it every `import ApplicationServices` in
    # input/target.py, input/injection.py and setup/permissions.py raised
    # ImportError on a real install, silently disabling AX target capture and the
    # DEF-192 AX paste fast path, and making the Accessibility check report a
    # false green. Paste still worked via the osascript fallback, which is why
    # this went unnoticed for four releases.
    "pyobjc-framework-ApplicationServices>=10.0,<13.0",
    "mcp>=1.0,<2.0",
    "psutil>=5.9,<6.0",
    "rich>=13.0,<15.0",
    # Core, not TTS-only: huggingface_hub downloads every model (wake word,
    # STT, TTS) + backs revision pinning; sounddevice is the primary cue
    # playback path (afplay is a fallback). CI installs [dev,chrome] without
    # [tts], so these must be core or the test suite can't import them.
    "sounddevice>=0.4.0,<1.0",
    "huggingface_hub>=0.20.0,<2.0",
]

[project.urls]
Homepage = "https://heyvox.dev"
Documentation = "https://github.com/heyvox-dev/heyvox#readme"
Repository = "https://github.com/heyvox-dev/heyvox"
Issues = "https://github.com/heyvox-dev/heyvox/issues"
Changelog = "https://github.com/heyvox-dev/heyvox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
apple-silicon = [
    "mlx-whisper>=0.1.0,<1.0",
]
tts = [
    "kokoro>=0.3.0,<1.0",
    # mlx-audio is a hard runtime import in herald/daemon/{kokoro,qwen}-daemon.py;
    # without it `pip install heyvox[tts]` yields a broken TTS daemon.
    "mlx-audio>=0.4.0,<1.0",
]
aec = [
    "livekit>=1.0.0,<2.0",
]
learn-vocab = [
    "anthropic>=0.84,<1",
]
dev = [
    # DEF-247: floor-only (or entirely unpinned) dev deps are the same risk
    # DEF-222 already named for ruff below — capped the same way as the
    # runtime deps above, one major version above what's currently installed.
    "pytest>=8.0,<10.0",
    "pytest-asyncio>=0.24,<2.0",
    "pytest-mock>=3.0,<4.0",
    "pytest-subprocess>=1.0,<2.0",
    # DEF-222: pinned — an unpinned ruff let 0.16.0 (released 2026-07-24)
    # activate new default rules and turn CI red on a version-bump-only
    # commit, mid-release. Bump deliberately, running the new version
    # locally first.
    "ruff==0.15.2",
]

[project.scripts]
heyvox = "heyvox.cli:main"
herald = "heyvox.herald.cli:main"

[tool.setuptools.packages.find]
include = ["heyvox*"]

[tool.setuptools.package-data]
heyvox = [
    "cues/*.wav", "cues/*.mp3", "cues/*.aiff",
    # Wake word models (custom .onnx, e.g. hey_vox)
    "models/*.onnx",
    # Bundled openwakeword models (hey_jarvis_v0.1 + feature extractors) so a
    # fresh `pip install` boots without a network download (DEF-159 follow-up).
    "models/oww/*.onnx",
    # Herald — TTS orchestration (Python daemon + hook shims)
    "herald/daemon/*.py",
    "herald/hooks/*.sh",
    # HUD — menu bar brand icons
    "hud/assets/*.png",
    # Hush — browser media control (Chrome extension + native host)
    "hush/extension/*.js",
    "hush/extension/*.html",
    "hush/extension/*.json",
    "hush/extension/icons/*.png",
    "hush/host/*.py",
    "hush/host/*.json",
    "hush/scripts/*.sh",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "strict"
# Integration tests require BlackHole + running heyvox — excluded by default.
# Run them explicitly: pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: requires BlackHole virtual audio and a running heyvox instance",
    "requires_audio: marks tests that need physical audio input hardware (skipped in CI)",
]

[tool.ruff.lint.extend-per-file-ignores]
# Late imports of constants that document neighboring state — moving them
# would obscure the rationale, and the import target is internal anyway.
"heyvox/audio/media.py" = ["E402"]
"heyvox/audio/tts.py" = ["E402"]
"heyvox/hud/overlay.py" = ["E402", "F821"]  # F821: nested-class closures over enclosing-fn params (NSObject dispatcher)
"heyvox/input/injection.py" = ["E402"]
# CLI / Colab style scripts: imports follow conditional pip installs and
# `if __name__ == "__main__"` guards, and some imports serve as availability probes.
"tools/**" = ["E402"]
"training/**" = ["E402", "F401"]
# Skipped test class with broken mock_detect/mock_switch refs — slated for
# rewrite in Plan 15-05 (resolve_lock); ruff sees the dead refs as F821.
"tests/test_target_restore.py" = ["F821"]
