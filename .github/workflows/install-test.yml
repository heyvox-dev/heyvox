name: Install Test

# Validates clean install experience. Only runs on main pushes (not every PR)
# because heavy deps (openwakeword, sherpa-onnx, pyobjc) make this slow.
on:
  push:
    branches: [main]

jobs:
  install-test:
    name: Clean Install
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          brew install portaudio

      - name: Create fresh venv and install package
        run: |
          python -m venv .venv-install-test
          .venv-install-test/bin/pip install --upgrade pip
          # Non-editable install, matching how a real user would install
          .venv-install-test/bin/pip install "."

      - name: Verify heyvox CLI works
        run: |
          .venv-install-test/bin/heyvox --help

      - name: Verify setup subcommand is available
        run: |
          .venv-install-test/bin/heyvox setup --help

      - name: Verify Python imports resolve correctly
        run: |
          .venv-install-test/bin/python -c "
          from heyvox.herald import get_herald_home
          from heyvox.hush import HUSH_HOME
          from heyvox.config import HeyvoxConfig
          import heyvox
          print('package version:', heyvox.__version__ if hasattr(heyvox, '__version__') else 'ok')
          print('herald home:', get_herald_home())
          print('hush home:', HUSH_HOME)
          print('imports ok')
          "

      - name: Verify wake-word model loads (the fresh-install boot path)
        run: |
          # This is the exact path that crashed on fresh installs (DEF-173):
          # the wheel must ship the bundled models and load_models() must
          # provision + load them without a network round-trip.
          .venv-install-test/bin/python -c "
          import numpy as np
          from heyvox.audio.wakeword import load_models
          model, _ = load_models('hey_jarvis_v0.1', 'hey_jarvis_v0.1')
          preds = model.predict(np.zeros(1280, dtype=np.int16))
          assert 'hey_jarvis_v0.1' in preds, preds
          print('wake-word model loads + predicts:', list(preds.keys()))
          "

      - name: Install Claude Code CLI (for plugin schema validation)
        run: |
          # Pinned deliberately — DEF-222: an unpinned tool that gates CI turns
          # unrelated commits red when upstream ships a change.
          npm install -g @anthropic-ai/claude-code@2.1.220
          claude --version

      - name: Validate the generated Claude Code plugin against the vendor schema
        run: |
          # DEF-227: this is the canary the hand-written settings.json path
          # never had. DEF-223 shipped an invalid hook shape for four releases
          # because nothing checked our output against Claude Code's schema.
          # `claude plugin validate` is that check, and it belongs to the
          # vendor — so it also catches schema drift on their side, which our
          # own guard tests structurally cannot.
          .venv-install-test/bin/python -c "
          from heyvox.setup import plugin
          plug = plugin.generate()
          print('generated:', plug)
          print('marketplace:', plugin.marketplace_dir())
          "
          PLUGIN_DIR="$(.venv-install-test/bin/python -c 'from heyvox.setup import plugin; print(plugin.plugin_dir())')"
          MARKET_DIR="$(.venv-install-test/bin/python -c 'from heyvox.setup import plugin; print(plugin.marketplace_dir())')"
          claude plugin validate "$PLUGIN_DIR"
          claude plugin validate "$MARKET_DIR"
