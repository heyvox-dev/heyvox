name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint GitHub Actions workflows
        run: |
          curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash -o download-actionlint.bash
          bash download-actionlint.bash 1.7.12
          ./actionlint -color

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          brew install portaudio shellcheck

      - name: Install package with dev extras
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,chrome]"

      - name: Lint with ruff
        run: |
          ruff check heyvox/ tests/

      - name: Run tests (excluding e2e and stress)
        run: |
          pytest tests/ --ignore=tests/test_e2e.py --ignore=tests/test_stress.py -v --tb=short

      - name: Verify CLI entry points
        run: |
          heyvox --help
          heyvox status || true
          # herald depends on runtime TTS deps — allow failure
          herald status || true

      - name: Verify Python imports
        run: |
          python -c "from heyvox.herald import get_herald_home; from heyvox.hush import HUSH_HOME; print('imports ok')"

      - name: Defect guard tests (regression prevention)
        run: |
          pytest tests/test_defect_guards.py -v --tb=short

  security:
    name: Security scans
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # DEF-180: secret scan. Blocking — a leaked credential is always
      # actionable. The gitleaks binary is version-pinned AND checksum-verified
      # (supply-chain hygiene for the tool itself). .gitleaks.toml allowlists the
      # Chrome extension's embedded PUBLIC key (a known false positive).
      - name: Secret scan (gitleaks)
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks dir . --config .gitleaks.toml --redact --no-banner

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # DEF-180: dependency CVE audit. Non-blocking — heyvox transitives
      # (starlette via FastMCP, urllib3, requests, ...) periodically carry CVEs
      # that need an upstream release; a hard gate would red CI on issues the
      # maintainer cannot immediately fix. Runs on every push for visibility;
      # promote to blocking (drop continue-on-error) once the tree is clean.
      - name: Dependency vulnerability audit (pip-audit)
        continue-on-error: true
        run: |
          pip install --upgrade pip pip-audit
          pip install -e .
          pip-audit --desc
